<!DOCTYPE html>
<html>
<head>
    <title>Search Tickets</title>
</head>
<body>
    <h1>Search results</h1>

    <p>Search query: {{ q }}</p>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Severity</th>
            <th>Status</th>
            <th>Owner ID</th>
        </tr>

        {% for r in results %}
        <tr>
            <td>{{ r[0] }}</td>
            <td>{{ r[1] }}</td>
            <td>{{ r[2] }}</td>
            <td>{{ r[3] }}</td>
            <td>{{ r[4] }}</td>
            <td>{{ r[5] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/tickets">Back to tickets</a>
</body>
</html>
